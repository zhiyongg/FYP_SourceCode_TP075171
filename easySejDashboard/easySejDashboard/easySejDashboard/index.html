<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy-Sej Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: {
                        'brand': '#04b087', 'brand-light': '#e8f7f3', 'bg-main': '#fdfcf9',
                        'text-primary': '#113540', 'text-secondary': '#6b8994',
                        'accent-orange': '#f59e0b', 'accent-red': '#ef4444',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-screen flex flex-col md:flex-row overflow-hidden antialiased bg-[#fdfcf9] text-[#113540]">

    <!-- Mobile Header -->
    <div class="md:hidden flex items-center justify-between bg-white border-b border-slate-200 p-4 relative z-20 shadow-sm">
         <!-- Logo and title -->
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-brand text-white flex items-center justify-center font-bold text-sm">ES</div>
            <!-- Dashboard title -->
            <h1 class="font-bold text-[#113540] text-base tracking-tight">Easy-Sej Dashboard</h1>
        </div>
        <button onclick="toggleSidebar()" class="text-slate-500 hover:text-[#113540] p-1 rounded-lg hover:bg-slate-100 transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- Sidebar Overlay for Mobile -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40 hidden md:hidden transition-opacity duration-300 opacity-0"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="w-[280px] md:w-[300px] flex-shrink-0 bg-white border-r border-slate-200 flex flex-col h-full fixed md:relative z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-2xl md:shadow-none">
        <div class="p-6 flex items-center justify-between md:justify-start gap-4">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-lg bg-brand text-white hidden md:flex items-center justify-center font-bold text-lg">ES</div>
                <div>
                    <h1 class="font-bold text-[#113540] text-lg leading-tight hidden md:block">Easy-Sej</h1>
                    <p class="text-sm text-[#6b8994] hidden md:block">Dashboard</p>
                    <h1 class="font-bold text-[#113540] text-lg md:hidden">Menu</h1>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 p-1 bg-slate-50 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Navigation Bar -->
        <nav class="px-4 py-2 space-y-1">
            <a href="#" onclick="showView('overall'); return false;" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#113540] hover:bg-slate-50 font-medium transition-colors" id="nav-overall">
                <i data-lucide="bar-chart-2" class="w-5 h-5 text-[#6b8994]"></i> Overall Performance
            </a>
            <a href="#" onclick="showView('students'); return false;" class="flex items-center gap-3 px-4 py-2.5 rounded-lg bg-brand text-white font-medium transition-colors shadow-sm" id="nav-students">
                <i data-lucide="users" class="w-5 h-5"></i> All Students
            </a>
            <a href="#" onclick="showView('atrisk'); return false;" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#113540] hover:bg-slate-50 font-medium transition-colors" id="nav-atrisk">
                <i data-lucide="alert-circle" class="w-5 h-5 text-[#6b8994]"></i> At Risk Students
            </a>
        </nav>

        <!-- Group Section -->
        <div class="px-4 pt-3 pb-1" id="sidebarGroupsSection">
            <div class="h-[1px] bg-slate-200 w-full mb-3"></div>
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-[#6b8994] uppercase tracking-wider">Groups</span>
            </div>
            <div id="sidebarGroupsList" class="space-y-0.5 mb-2"></div>
        </div>

        <!-- Search Bar -->
        <div class="px-4 py-3">
            <div class="h-[1px] bg-slate-200 w-full mb-3"></div>
            <div class="relative">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Search by email..."
                    class="w-full pl-9 pr-4 py-2.5 bg-[#f4f3ed] border-0 rounded-lg text-sm focus:ring-2 focus:ring-brand focus:outline-none placeholder-slate-400">
            </div>
        </div>

        <!-- Student List -->
        <div class="flex-1 overflow-y-auto sidebar-scroll px-2 pb-4" id="sidebarStudentList"></div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 h-full overflow-y-auto bg-[#fdfcf9] w-full">
        <div class="p-4 md:p-8 max-w-6xl mx-auto" id="mainContent">
            <div class="flex items-center justify-center h-[60vh] text-[#6b8994]">
                <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-brand"></i>
                <span class="ml-3 font-medium">Initializing Dashboard...</span>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/views.js"></script>
</body>
</html>
